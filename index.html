<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - Cosmic Cake & Firework Show</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #03030d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin-bottom: 8px;
            font-weight: 300;
            background: linear-gradient(45deg, #8a2be2, #ffd700, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 0.85rem;
            color: #d0c088;
            letter-spacing: 1px;
        }
        /* 交互按钮栏 */
        .controls-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 15px;
        }
        .btn {
            background: rgba(138, 43, 226, 0.35);
            border: 1px solid rgba(255, 215, 0, 0.7);
            color: #fff;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }
        .btn:hover {
            background: rgba(255, 215, 0, 0.5);
            color: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
        }
        /* 摄像头预览窗口 */
        .webcam-box {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 140px;
            height: 105px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 255, 0.5);
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .status-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
        }
        /* 照片详情文字（HTML 覆盖层） */
        #photo-caption {
            position: fixed;
            left: 50%;
            bottom: 12%;
            transform: translateX(-50%) translateY(12px);
            width: min(680px, 82vw);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            z-index: 15;
        }
        #photo-caption.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #caption-title {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: #ffe9a8;
            text-shadow: 0 0 14px rgba(255, 200, 80, 0.55), 0 2px 8px rgba(0, 0, 0, 0.9);
            margin-bottom: 0.5rem;
        }
        #caption-desc {
            font-size: 0.95rem;
            line-height: 1.75;
            color: #dfe3ff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }
        #caption-hint {
            margin-top: 0.9rem;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: rgba(200, 200, 230, 0.55);
        }
    </style>
    <!-- 基础渲染库（本地文件，不依赖国外 CDN） -->
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="lib/gsap.min.js"></script>
    <!-- 照片文案（可自行编辑，键名对应 images 的文件序号） -->
    <script src="captions.js"></script>

    <!-- MediaPipe Hands 手势库 -->
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1 id="title-text">HAPPY BIRTHDAY</h1>
        <p id="sub-text">✊握拳:蛋糕 | ✋张开手掌:照片墙 | ✌️比耶:放全屏烟花</p>
    </div>

    <div class="controls-panel">
        <button class="btn" id="toggle-btn" onclick="togglePhotos()">切换照片墙</button>
        <button class="btn" onclick="triggerRandomFireworks()">放全屏烟花</button>
    </div>

    <div id="photo-caption">
        <div id="caption-title"></div>
        <div id="caption-desc"></div>
        <div id="caption-hint">点击空白处 / ESC / 再捏合一次 返回照片墙</div>
    </div>

    <div class="webcam-box">
        <div class="status-badge" id="gesture-status">初始化手势...</div>
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. 基础场景初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03030d, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 38);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. 纹理生成器 ---
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            const cx = 32, cy = 32, outerRadius = 28, innerRadius = 12;
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(cx + Math.cos((18 + i * 72) * Math.PI / 180) * outerRadius, cy - Math.sin((18 + i * 72) * Math.PI / 180) * outerRadius);
                ctx.lineTo(cx + Math.cos((54 + i * 72) * Math.PI / 180) * innerRadius, cy - Math.sin((54 + i * 72) * Math.PI / 180) * innerRadius);
            }
            ctx.closePath();
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 215, 0, 0.9)');
            gradient.addColorStop(0.8, 'rgba(138, 43, 226, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient; ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 200, 50, 0.8)');
            gradient.addColorStop(0.8, 'rgba(138, 43, 226, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const starTexture = createStarTexture();
        const glowTexture = createGlowTexture();

        // --- 3. 3D 蛋糕与坐标计算 ---
        const cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        const cakeParticles = [];
        const cakeColors = [];
        const originPositions = [];     
        const explodedPositions = [];   

        const mixedPalette = [
            new THREE.Color(0x8a2be2), new THREE.Color(0x9400d3), 
            new THREE.Color(0xffd700), new THREE.Color(0xffa500), 
            new THREE.Color(0x00ffff), new THREE.Color(0xffea00)
        ];
        const creamPalette = [new THREE.Color(0xfff8dc), new THREE.Color(0xfffacd), new THREE.Color(0xffffff)];

        function addCylinderLayer(bottomRadius, topRadius, height, yOffset, particleCount, colorPalette) {
            for (let i = 0; i < particleCount; i++) {
                const h = Math.random() * height;
                const radiusRatio = h / height;
                const currentRadius = bottomRadius + (topRadius - bottomRadius) * radiusRatio;
                const r = Math.sqrt(Math.random()) * currentRadius;
                const theta = Math.random() * Math.PI * 2;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                const y = yOffset + h;

                cakeParticles.push(x, y, z);
                originPositions.push(x, y, z);

                const expR = 22 + Math.random() * 22;
                const expTheta = Math.random() * Math.PI * 2;
                const expPhi = Math.acos((Math.random() * 2) - 1);
                explodedPositions.push(
                    expR * Math.sin(expPhi) * Math.cos(expTheta),
                    expR * Math.sin(expPhi) * Math.sin(expTheta),
                    expR * Math.cos(expPhi)
                );

                const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                cakeColors.push(color.r, color.g, color.b);
            }
        }

        addCylinderLayer(12, 12, 0.4, -4, 2000, [new THREE.Color(0xffd700), new THREE.Color(0x191970)]);
        addCylinderLayer(9, 9, 4, -3.6, 5200, mixedPalette);
        addCylinderLayer(9.2, 9.2, 0.5, -1.6, 1600, creamPalette);
        addCylinderLayer(6.5, 6.5, 3.5, 0.4, 4000, mixedPalette);
        addCylinderLayer(6.7, 6.7, 0.5, 2.1, 1200, creamPalette);
        addCylinderLayer(4, 4, 3, 3.9, 2800, mixedPalette);
        addCylinderLayer(0.4, 0.4, 2.5, 6.9, 480, [new THREE.Color(0xffff00), new THREE.Color(0xffffff)]);

        const flameStartIndex = cakeParticles.length / 3;
        for (let i = 0; i < 280; i++) {
            const r = Math.random() * 0.7;
            const theta = Math.random() * Math.PI * 2;
            const h = Math.random() * 1.8;
            const x = r * Math.cos(theta), y = 9.4 + h, z = r * Math.sin(theta);
            cakeParticles.push(x, y, z);
            originPositions.push(x, y, z);

            const expR = 18 + Math.random() * 18;
            const expTheta = Math.random() * Math.PI * 2;
            const expPhi = Math.acos((Math.random() * 2) - 1);
            explodedPositions.push(expR * Math.sin(expPhi) * Math.cos(expTheta), expR * Math.sin(expPhi) * Math.sin(expTheta), expR * Math.cos(expPhi));

            cakeColors.push(1.0, 0.7 + Math.random() * 0.3, 0.1);
        }

        const cakeGeometry = new THREE.BufferGeometry();
        cakeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cakeParticles, 3));
        cakeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(cakeColors, 3));

        const cakeMaterial = new THREE.PointsMaterial({
            size: 0.38, vertexColors: true, map: glowTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const cakePoints = new THREE.Points(cakeGeometry, cakeMaterial);
        cakeGroup.add(cakePoints);

        // --- 4. 几何线框 ---
        const wireframeGroup = new THREE.Group();
        cakeGroup.add(wireframeGroup);
        function addWireframeCylinder(radius, height, y, colorCode) {
            const geo = new THREE.CylinderGeometry(radius, radius, height, 12, 1, true);
            const wireframe = new THREE.WireframeGeometry(geo);
            const mat = new THREE.LineBasicMaterial({ color: colorCode, transparent: true, opacity: 0.35 });
            const line = new THREE.LineSegments(wireframe, mat);
            line.position.y = y;
            wireframeGroup.add(line);
        }
        addWireframeCylinder(9.05, 4, -1.6, 0xffd700);
        addWireframeCylinder(6.55, 3.5, 2.15, 0xba55d3);
        addWireframeCylinder(4.05, 3, 5.4, 0xffea00);

        // --- 5. 照片墙组 ---
        const photoGroup = new THREE.Group();
        scene.add(photoGroup);
        const photoMeshes = [];
        // 照片数量：images 目录里依次放 1.jpg ~ N.jpg，这里的 N 要和文件数量一致
        const TOTAL_PHOTOS = 12;
        const textureLoader = new THREE.TextureLoader();

        const PLANE_W = 4, PLANE_H = 3;   // 照片墙单元的基础尺寸
        const PHOTO_SCALE = 1.5;          // 照片整体放大倍数
        const PHOTO_RADIUS = 20;          // 照片墙球面半径（照片越多越要调大，避免拥挤）

        for (let i = 1; i <= TOTAL_PHOTOS; i++) {
            const geometry = new THREE.PlaneGeometry(PLANE_W, PLANE_H);
            const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true, opacity: 0 });

            const mesh = new THREE.Mesh(geometry, mat);
            mesh.scale.set(0, 0, 0);
            photoGroup.add(mesh);
            photoMeshes.push(mesh);

            // 按图片真实宽高比等比缩放到 PLANE_W × PLANE_H 的框内，保证不变形
            const fitToAspect = (aspect) => {
                mesh.userData.aspect = aspect;
                if (aspect >= PLANE_W / PLANE_H) {
                    mesh.userData.scaleX = 1;
                    mesh.userData.scaleY = (PLANE_W / aspect) / PLANE_H;
                } else {
                    mesh.userData.scaleX = (PLANE_H * aspect) / PLANE_W;
                    mesh.userData.scaleY = 1;
                }
                mesh.userData.scaleX *= PHOTO_SCALE;
                mesh.userData.scaleY *= PHOTO_SCALE;
                // 纹理迟到时若已经展开，立即套用新比例
                if (mesh.scale.x > 0) {
                    mesh.scale.set(mesh.userData.scaleX, mesh.userData.scaleY, 1);
                }
            };
            fitToAspect(PLANE_W / PLANE_H); // 占位图默认 4:3

            // 便携版会把图片以 base64 内嵌到 PHOTO_DATA，优先用它；否则读本地 images 目录
            const photoSrc = (window.PHOTO_DATA && window.PHOTO_DATA[i]) || `images/${i}.jpg`;
            textureLoader.load(photoSrc, 
                (tex) => {
                    mat.map = tex;
                    mat.needsUpdate = true;
                    fitToAspect(tex.image.width / tex.image.height);
                }, 
                undefined, 
                () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 256; canvas.height = 192;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#1a0b36'; ctx.fillRect(0, 0, 256, 192);
                    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, 256, 192);
                    ctx.fillStyle = '#ffffff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(`Photo ${i}`, 128, 100);
                    mat.map = new THREE.CanvasTexture(canvas);
                    mat.needsUpdate = true;
                    fitToAspect(256 / 192);
                }
            );
        }

        // --- 照片详情：放大显示 + 文字说明 ---
        const raycaster = new THREE.Raycaster();
        const detailMaterial = new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthTest: false
        });
        const detailMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), detailMaterial);
        detailMesh.visible = false;
        detailMesh.renderOrder = 999;
        scene.add(detailMesh);

        let detailOpen = false;
        let detailIndex = -1;
        let pinchLatch = false;      // 捏合手势的上升沿锁，防止按住不放连续触发
        let pinchFrames = 0;         // 连续满足捏合条件的帧数
        let pinchAnchor = null;      // 开始捏合时的掌心位置，用来判断手是否在移动
        const PINCH_HOLD_FRAMES = 2;  // 连续多少帧捏合才生效，约 200ms
        const PINCH_MAX_DRIFT = 0.15; // 捏合过程中手允许的最大位移，超过视为在挥手掌
        let lastPinchTime = 0;
        let pointerDownAt = null;    // 鼠标按下位置，用于区分"点击"和"拖动视角"
        const DETAIL_DISTANCE = 10;  // 详情照片与相机的距离
        const DETAIL_MAX_H = 6.2;    // 详情照片最大高度（世界单位）
        const DETAIL_MAX_W = 9.4;    // 详情照片最大宽度

        function ndcFromEvent(event) {
            return new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
        }

        function pickPhotoIndex(event) {
            raycaster.setFromCamera(ndcFromEvent(event), camera);
            const hits = raycaster.intersectObjects(photoMeshes, false);
            return hits.length ? photoMeshes.indexOf(hits[0].object) : -1;
        }

        // 当前位于画面中央的那张照片（供捏合手势使用）
        function getCenteredPhotoIndex() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(photoMeshes, false);
            if (hits.length) return photoMeshes.indexOf(hits[0].object);

            // 视线正好穿过照片之间的缝隙时，退化为"离视线最近"的照片
            let best = -1, bestDist = 2.5;
            photoMeshes.forEach((mesh, index) => {
                const p = mesh.getWorldPosition(new THREE.Vector3());
                const d = raycaster.ray.distanceToPoint(p);
                if (d < bestDist) { bestDist = d; best = index; }
            });
            return best;
        }

        function openDetail(index) {
            const mesh = photoMeshes[index];
            if (detailOpen || !mesh || !mesh.material.map) return;

            detailOpen = true;
            detailIndex = index;
            controls.enabled = false;   // 详情页固定视角，避免拖动把照片转出屏幕

            detailMaterial.map = mesh.material.map;
            detailMaterial.needsUpdate = true;
            detailMaterial.opacity = 0;

            const aspect = mesh.userData.aspect || (PLANE_W / PLANE_H);
            let h = DETAIL_MAX_H, w = h * aspect;
            if (w > DETAIL_MAX_W) { w = DETAIL_MAX_W; h = w / aspect; }
            detailMesh.scale.set(w, h, 1);

            // 摆在相机正前方，正对相机
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            detailMesh.position.copy(camera.position).add(dir.multiplyScalar(DETAIL_DISTANCE));
            detailMesh.lookAt(camera.position);
            detailMesh.visible = true;

            photoMeshes.forEach((m) => gsap.to(m.material, { opacity: 0.08, duration: 0.4 }));
            gsap.to(detailMaterial, { opacity: 1, duration: 0.5 });

            // 文案来自 captions.js，键名是文件序号（从 1 开始）
            const entry = (window.PHOTO_CAPTIONS || {})[index + 1] || {};
            document.getElementById('caption-title').innerText = entry.title || '';
            document.getElementById('caption-desc').innerText = entry.desc || '';
            document.getElementById('photo-caption').classList.add('show');
        }

        function closeDetail(instant) {
            if (!detailOpen) return;
            detailOpen = false;
            detailIndex = -1;
            document.getElementById('photo-caption').classList.remove('show');

            if (instant) {
                detailMaterial.opacity = 0;
                detailMesh.visible = false;
            } else {
                gsap.to(detailMaterial, {
                    opacity: 0, duration: 0.35,
                    onComplete: () => { detailMesh.visible = false; }
                });
            }
            photoMeshes.forEach((m) => {
                if (instant) m.material.opacity = 1;
                else gsap.to(m.material, { opacity: 1, duration: 0.6 });
            });
            controls.enabled = true;
        }

        // 鼠标点击照片查看详情，点击空白处返回
        renderer.domElement.addEventListener('pointerdown', (e) => {
            pointerDownAt = { x: e.clientX, y: e.clientY };
        });
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (!pointerDownAt) return;
            const moved = Math.hypot(e.clientX - pointerDownAt.x, e.clientY - pointerDownAt.y);
            pointerDownAt = null;
            if (moved > 6) return;   // 拖动视角，不算点击

            if (detailOpen) {
                // 点在照片本身不关闭，点其它位置返回照片墙
                raycaster.setFromCamera(ndcFromEvent(e), camera);
                if (!raycaster.intersectObject(detailMesh, false).length) closeDetail();
                return;
            }
            if (currentState !== 'exploded') return;
            const idx = pickPhotoIndex(e);
            if (idx !== -1) openDetail(idx);
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && detailOpen) closeDetail();
        });

        // --- 6. 全屏多形态烟花系统 (Fireworks Show) ---
        const fireworksGroup = new THREE.Group();
        scene.add(fireworksGroup);

        function triggerRandomFireworks() {
            // 一次性随机绽放 2 到 4 束烟花，高低错落，形态各异
            const burstCount = 2 + Math.floor(Math.random() * 3);
            for (let b = 0; b < burstCount; b++) {
                setTimeout(() => {
                    singleFireworkBurst();
                }, b * 250);
            }
        }

        function singleFireworkBurst() {
            const particleCount = 120 + Math.floor(Math.random() * 100);
            const positions = [];
            const colors = [];
            const velocities = [];

            // 随机烟花中心点（分散在屏幕四周与高空）
            const startX = (Math.random() - 0.5) * 35;
            const startY = 2 + Math.random() * 18;
            const startZ = (Math.random() - 0.5) * 20;

            const baseHue = Math.random();
            const fColor = new THREE.Color();

            for (let i = 0; i < particleCount; i++) {
                positions.push(startX, startY, startZ);
                
                // 邻近色搭配
                fColor.setHSL((baseHue + (Math.random() - 0.5) * 0.15) % 1.0, 1.0, 0.65);
                colors.push(fColor.r, fColor.g, fColor.b);

                // 随机形态：球形扩散或拖尾扩散
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const speed = 6 + Math.random() * 16; // 扩散速度大小不一

                velocities.push(
                    speed * Math.sin(phi) * Math.cos(theta),
                    speed * Math.sin(phi) * Math.sin(theta),
                    speed * Math.cos(phi)
                );
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.4 + Math.random() * 0.4, // 大小不一
                vertexColors: true, 
                map: glowTexture, 
                transparent: true, 
                blending: THREE.AdditiveBlending, 
                depthWrite: false
            });

            const fwPoints = new THREE.Points(geo, mat);
            fireworksGroup.add(fwPoints);

            const fwClock = new THREE.Clock();
            let life = 1.0;
            const anim = () => {
                const dt = fwClock.getDelta();
                const posArr = geo.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    posArr[i * 3] += velocities[i * 3] * dt;
                    posArr[i * 3 + 1] += (velocities[i * 3 + 1] - 4.5 * dt) * dt; // 重力
                    posArr[i * 3 + 2] += velocities[i * 3 + 2] * dt;
                }
                geo.attributes.position.needsUpdate = true;
                life -= 0.012;
                mat.opacity = life;

                if (life > 0) {
                    requestAnimationFrame(anim);
                } else {
                    fireworksGroup.remove(fwPoints);
                    geo.dispose();
                    mat.dispose();
                }
            };
            anim();
        }

        // --- 7. 独立状态管理 (蛋糕 ↔ 照片墙) ---
        let currentState = 'cake'; // 'cake' | 'exploded'

        function togglePhotos() {
            // 按钮点击在 蛋糕 与 照片墙 之间切换
            if (currentState === 'cake') {
                currentState = 'exploded';
            } else {
                currentState = 'cake';
            }
            updateSceneState();
        }

        function updateSceneState() {
            const btn = document.getElementById('toggle-btn');
            const title = document.getElementById('title-text');
            const sub = document.getElementById('sub-text');
            const currentPos = cakeGeometry.attributes.position.array;

            // 切换形态时立刻收起详情，避免详情层残留
            if (detailOpen) closeDetail(true);

            if (currentState === 'exploded') {
                btn.innerText = "恢复蛋糕形态";
                title.innerText = "MEMORIES";
                sub.innerText = "🖐移动手:转动照片墙 | 👌捏合:照片详情 | ✌️比耶:烟花 | 按钮返回蛋糕";

                gsap.to(currentPos, { endArray: explodedPositions, duration: 1.8, ease: "power3.out", onUpdate: () => cakeGeometry.attributes.position.needsUpdate = true });
                gsap.to(wireframeGroup.scale, { x: 0, y: 0, z: 0, duration: 1 });

                photoMeshes.forEach((mesh, index) => {
                    const phi = Math.acos(-1 + (2 * index) / TOTAL_PHOTOS);
                    const theta = Math.sqrt(TOTAL_PHOTOS * Math.PI) * phi;
                    const radius = PHOTO_RADIUS;
                    const targetX = radius * Math.cos(theta) * Math.sin(phi);
                    const targetY = radius * Math.sin(theta) * Math.sin(phi);
                    const targetZ = radius * Math.cos(phi);

                    mesh.position.set(0, 0, 0);
                    mesh.lookAt(targetX * 2, targetY * 2, targetZ * 2);
                    gsap.to(mesh.position, { x: targetX, y: targetY, z: targetZ, duration: 1.5, delay: index * 0.02, ease: "back.out(1.2)" });
                    gsap.to(mesh.scale, { x: mesh.userData.scaleX, y: mesh.userData.scaleY, z: 1, duration: 1, delay: index * 0.02 });
                    gsap.to(mesh.material, { opacity: 1, duration: 1, delay: index * 0.02 });
                });

            } else {
                btn.innerText = "切换照片墙";
                title.innerText = "HAPPY BIRTHDAY";
                sub.innerText = "✋张开手掌:照片墙 | ✌️比耶:放烟花";

                gsap.to(currentPos, { endArray: originPositions, duration: 1.8, ease: "power3.inOut", onUpdate: () => cakeGeometry.attributes.position.needsUpdate = true });
                gsap.to(wireframeGroup.scale, { x: 1, y: 1, z: 1, duration: 1 });

                photoMeshes.forEach((mesh) => {
                    gsap.to(mesh.position, { x: 0, y: 0, z: 0, duration: 1 });
                    gsap.to(mesh.scale, { x: 0, y: 0, z: 0, duration: 0.8 });
                    gsap.to(mesh.material, { opacity: 0, duration: 0.8 });
                });
            }
        }

        // --- 8. 手势控制逻辑（严格遵循：状态由手势改变，比耶独立放烟花不改变状态） ---
        const videoElement = document.getElementById('webcam');
        const statusBadge = document.getElementById('gesture-status');
        let lastActionTime = 0;
        let lastFireworkTime = 0;

        // 手部移动 -> 照片墙转向（上下左右）
        let handMoveX = null;         // 掌心横向位置（0~1，已按镜像方向修正）
        let handMoveY = null;         // 掌心纵向位置（0~1）
        let handMoveSeenAt = 0;       // 最近一次识别到手的时间戳
        let lastHandX = null;         // 上一帧掌心横向位置，用于计算位移
        let lastHandY = null;         // 上一帧掌心纵向位置
        let photoRotY = 0;            // 照片墙水平旋转目标角（左右）
        let photoRotX = 0;            // 照片墙俯仰旋转目标角（上下）
        let photoRotSmooth = 0;       // 平滑后的水平旋转角
        let photoRotXSmooth = 0;      // 平滑后的俯仰旋转角
        const HAND_DEAD_ZONE = 0.012; // 手部抖动死区，小于该位移视为抖动
        const HAND_GAIN = 4.0;        // 移动灵敏度（位移 -> 弧度）
        const TILT_LIMIT = 0.65;      // 上下俯仰的最大角度，防止翻过头

        let mediaPipeRetry = 0;   // 手势库加载重试次数

        function initMediaPipe() {
            if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
                // 约 5 秒还没加载到，就放弃手势，页面按钮和鼠标仍然可用
                mediaPipeRetry++;
                if (mediaPipeRetry > 10) {
                    statusBadge.innerText = "手势库加载失败(可用按钮)";
                    statusBadge.style.color = "#ff8800";
                    return;
                }
                statusBadge.innerText = "手势库加载中...";
                setTimeout(initMediaPipe, 500);
                return;
            }

            const hands = new Hands({
                locateFile: (file) => `https://unpkg.com/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const handsData = results.multiHandLandmarks;

                    // 单手手势判定
                    const landmarks = handsData[0];
                    const wrist = landmarks[0];

                    // 掌心位置（手腕 0 号点与中指根部 9 号点的中点）
                    // 视频画面是镜像显示的，所以横向取 1 - x 才和手的实际方向一致；纵向不变
                    handMoveX = 1 - (landmarks[0].x + landmarks[9].x) / 2;
                    handMoveY = (landmarks[0].y + landmarks[9].y) / 2;
                    handMoveSeenAt = performance.now();

                    // 捏合手势（拇指尖 4 与食指尖 8 靠近）-> 查看画面中央那张照片的详情
                    // 用 3D 距离判定，且要求"手基本不动 + 连续多帧成立"，避免挥手掌转动照片墙时误触发
                    const pinchDist = Math.hypot(
                        landmarks[4].x - landmarks[8].x,
                        landmarks[4].y - landmarks[8].y,
                        landmarks[4].z - landmarks[8].z
                    );
                    if (pinchDist < 0.045) {
                        if (!pinchAnchor) pinchAnchor = { x: handMoveX, y: handMoveY };
                        const drift = Math.hypot(handMoveX - pinchAnchor.x, handMoveY - pinchAnchor.y);
                        if (drift < PINCH_MAX_DRIFT) {
                            pinchFrames++;
                        } else {
                            // 手在移动（正在转动照片墙），重新计时
                            pinchFrames = 0;
                            pinchAnchor = { x: handMoveX, y: handMoveY };
                        }

                        if (!pinchLatch && pinchFrames >= PINCH_HOLD_FRAMES) {
                            pinchLatch = true;
                            if (currentState === 'exploded' && Date.now() - lastPinchTime > 800) {
                                lastPinchTime = Date.now();
                                if (detailOpen) {
                                    closeDetail();
                                } else {
                                    const idx = getCenteredPhotoIndex();
                                    if (idx !== -1) openDetail(idx);
                                }
                            }
                        }
                        if (pinchLatch && currentState === 'exploded') {
                            // 捏合时直接返回，避免被误判成"握拳"而切回蛋糕
                            statusBadge.innerText = "捏合 👌 (选中照片)";
                            statusBadge.style.color = "#ffcc00";
                            return;
                        }
                    } else {
                        pinchFrames = 0;
                        pinchAnchor = null;
                        if (pinchDist > 0.09) pinchLatch = false;
                    }

                    const tips = [4, 8, 12, 16, 20];
                    const dists = tips.map(t => Math.hypot(landmarks[t].x - wrist.x, landmarks[t].y - wrist.y));
                    const avgDist = dists.reduce((a, b) => a + b) / 5;

                    // 判断比耶 (✌️)：食指与中指伸直，无名指和小指收拢
                    const isVGesture = dists[1] > 0.32 && dists[2] > 0.32 && dists[3] < 0.26 && dists[4] < 0.26;

                    if (isVGesture) {
                        // 独立烟花动作：不改变当前场景形态（蛋糕/照片保持不变），只在空中放烟花
                        statusBadge.innerText = "比耶 ✌️ (放烟花)";
                        statusBadge.style.color = "#00ffcc";
                        if (Date.now() - lastFireworkTime > 1200) {
                            triggerRandomFireworks();
                            lastFireworkTime = Date.now();
                        }
                    } else if (avgDist > 0.36) {
                        // 手掌张开 (✋) -> 切换到照片墙状态
                        statusBadge.innerText = "手掌张开 ✋";
                        statusBadge.style.color = "#00ffff";
                        if (currentState !== 'exploded' && Date.now() - lastActionTime > 2000) {
                            currentState = 'exploded';
                            updateSceneState();
                            lastActionTime = Date.now();
                        }
                    } else {
                        // 握拳不再切回蛋糕：照片墙状态下只能用按钮返回，避免捏合时被误判成握拳
                        statusBadge.innerText = "握拳 ✊";
                        statusBadge.style.color = "#a08a40";
                    }
                } else {
                    statusBadge.innerText = "未检测到手部";
                    statusBadge.style.color = "#a0a0c0";
                    // 手离开画面，停止手控，照片墙恢复自动慢速旋转
                    handMoveX = null;
                    handMoveY = null;
                    lastHandX = null;
                    lastHandY = null;
                }
            });

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 320,
                height: 240
            });

            // 同源窗口协调：新窗口需要摄像头时，通知其它标签页主动释放
            const camChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('birthday-camera') : null;
            if (camChannel) {
                camChannel.onmessage = (e) => {
                    if (e.data === 'release-camera') {
                        cameraUtils.stop();
                        videoElement.srcObject = null;
                        statusBadge.innerText = "摄像头已让给另一个窗口";
                        statusBadge.style.color = "#8888a0";
                        camChannel.close();
                    }
                };
            }

            const startCamera = (retried) => {
                cameraUtils.start().then(() => {
                    statusBadge.innerText = "手势就绪";
                }).catch((err) => {
                    // NotReadableError / Device in use：摄像头被其它程序或其它标签页占用
                    const busy = /NotReadable|Device in use/i.test(String(err));
                    // 第一次失败时先请求同源标签页释放摄像头，等一下再重试一次
                    if (busy && !retried && camChannel) {
                        camChannel.postMessage('release-camera');
                        setTimeout(() => startCamera(true), 1200);
                        return;
                    }
                    statusBadge.innerText = busy ? "摄像头被其它程序占用" : "摄像头未授权(可用按钮)";
                    statusBadge.style.color = busy ? "#ff5555" : "#ff8800";
                });
            };
            startCamera(false);
        }

        setTimeout(initMediaPipe, 1000);

        // --- 9. 实时渲染循环 ---
        let clock = new THREE.Clock();
        let lastFrameTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            const dt = Math.min(elapsedTime - lastFrameTime, 0.1);
            lastFrameTime = elapsedTime;

            // 查看照片详情时冻结所有粒子/照片墙，避免背景晃动分散注意力
            if (!detailOpen) {
                cakeGroup.rotation.y = elapsedTime * 0.12;
            }

            if (currentState === 'exploded' && !detailOpen) {
                // 手在摄像头画面里上下左右移动 -> 照片墙跟着转动（捏合时不响应，避免选中的照片被转走）
                const handActive = handMoveX !== null && (performance.now() - handMoveSeenAt) < 300 && !pinchLatch;
                if (handActive) {
                    if (lastHandX !== null && lastHandY !== null) {
                        const dx = handMoveX - lastHandX;
                        if (Math.abs(dx) > HAND_DEAD_ZONE) {
                            photoRotY += dx * HAND_GAIN;
                        }
                        const dy = handMoveY - lastHandY;
                        if (Math.abs(dy) > HAND_DEAD_ZONE) {
                            photoRotX += dy * HAND_GAIN;
                            // 限制上下翻转幅度，避免转到头朝下
                            photoRotX = Math.max(-TILT_LIMIT, Math.min(TILT_LIMIT, photoRotX));
                        }
                    }
                    lastHandX = handMoveX;
                    lastHandY = handMoveY;
                } else {
                    // 没有手时保持原来的自动慢速旋转，俯仰角缓慢回正
                    lastHandX = null;
                    lastHandY = null;
                    photoRotY += dt * 0.08;
                    photoRotX += (0 - photoRotX) * 0.04;
                }
                // 平滑跟随，避免手部抖动导致画面抽搐
                photoRotSmooth += (photoRotY - photoRotSmooth) * 0.15;
                photoRotXSmooth += (photoRotX - photoRotXSmooth) * 0.15;
                photoGroup.rotation.set(photoRotXSmooth, photoRotSmooth, 0);
            }

            if (currentState === 'cake') {
                const positions = cakeGeometry.attributes.position.array;
                for (let i = flameStartIndex; i < positions.length / 3; i++) {
                    const idx = i * 3;
                    positions[idx] += Math.sin(elapsedTime * 6 + i) * 0.012;
                    positions[idx + 2] += Math.cos(elapsedTime * 6 + i) * 0.012;
                }
                cakeGeometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
